name: Format Check

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'app/**'
      
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'app/**'

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check formatting with Prettier
        run: |
          prettier --check "app/**/*.{js,html,css,json}"