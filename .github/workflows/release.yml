name: Release (.tar.gz)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout (WICHTIG: full history + tags)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Git Setup
      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      # 3️⃣ Tags sicher holen
      - name: Fetch tags
        run: git fetch --tags --force

      # 4️⃣ Version bestimmen (Patch als Standard, Major/Minor via Commit-Nachricht)
      - name: Determine next version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          VERSION=${LAST_TAG#v}

          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          MSG="$(git log -1 --pretty=%B)"

          if echo "$MSG" | grep -iq "\[major\]"; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif echo "$MSG" | grep -iq "\[minor\]"; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      # 5️⃣ Release-Dateien direkt aus dem app-Ordner vorbereiten
      - name: Prepare release folder
        run: |
          rm -rf .release_temp
          mkdir -p .release_temp

          # Kopiert alles, was im app-Ordner liegt (index.html, app.js, Counter.js, style.css, assets, manifest.json)
          cp -r app/* .release_temp/
          
          # Falls du die LICENSE oder README im Root hast und mitliefern willst:
          [ -f LICENSE ] && cp LICENSE .release_temp/LICENSE
          [ -f README.md ] && cp README.md .release_temp/README.md

      # 6️⃣ Archive bauen (enthält nun sauber die Struktur direkt aus app/)
      - name: Create archive
        run: |
          tar -czf Counter-App-v${{ env.NEXT_VERSION }}.tar.gz -C .release_temp .

      # 7️⃣ Tag erstellen
      - name: Create Git tag
        run: |
          git tag v${{ env.NEXT_VERSION }}
          git push origin v${{ env.NEXT_VERSION }}

      # 8️⃣ GitHub Release erstellen
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.NEXT_VERSION }}
          name: Counter-App v${{ env.NEXT_VERSION }}
          artifacts: Counter-App-v${{ env.NEXT_VERSION }}.tar.gz
          generateReleaseNotes: true
          draft: false
          prerelease: false